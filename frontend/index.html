<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#0f0f23">
        <title>CodingAP's Advent of Code Hub</title>

        <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
        <link rel="shortcut icon" href="/static/favicon/favicon.ico">

        <!-- the full dockview build injects its own stylesheet at runtime (the esm build ships without css) -->
        <script src="https://cdn.jsdelivr.net/npm/dockview-core@8.8.3/dist/dockview-core.min.js"></script>
        <link rel="stylesheet" href="/static/styles.css">

        <!-- apply the saved theme before the first paint so there is no flash of the default colours -->
        <script>
        try {
            const theme = JSON.parse(localStorage.getItem('aoc.settings') || '{}').theme || 'aoc';
            document.documentElement.dataset.theme = theme;
        } catch (_) {
            document.documentElement.dataset.theme = 'aoc';
        }
        </script>
        <!-- monaco is loaded through its amd loader; workers must be wrapped in a blob because they come from another origin -->
        <script>
        window.MONACO_CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
        window.MonacoEnvironment = {
            getWorkerUrl: () =>
                URL.createObjectURL(
                    new Blob(
                        [`self.MonacoEnvironment = { baseUrl: '${window.MONACO_CDN}/' }; importScripts('${window.MONACO_CDN}/vs/base/worker/workerMain.js');`],
                        { type: 'text/javascript' },
                    ),
                ),
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
        <script>
        require.config({ paths: { vs: window.MONACO_CDN + '/vs' } });
        </script>
    </head>

    <body>
        <div id="snowflakes"></div>
        <header id="topbar"></header>
        <main id="dashboard" class="view hidden"></main>
        <main id="workspace" class="view hidden"></main>
        <script type="module" src="/dist/main.js"></script>
    </body>
</html>
